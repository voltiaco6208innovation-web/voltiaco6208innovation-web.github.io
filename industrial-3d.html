<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEROVOLT · Visualizador Industrial 3D</title>
  <meta name="robots" content="noindex" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
    canvas { display: block; }
    .hud {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      font-family: system-ui, sans-serif; color: #e8f0ff;
      background: rgba(5,7,13,0.75); backdrop-filter: blur(10px);
      border: 1px solid rgba(0,229,255,0.25); border-radius: 12px;
      padding: 14px 18px; max-width: 280px; font-size: 0.85rem;
    }
    .hud h1 { font-size: 0.95rem; color: #00e5ff; margin-bottom: 8px; letter-spacing: 0.06em; }
    .hud p { color: #8b9bb8; margin-bottom: 6px; }
    .hud .val { color: #00ff9d; font-weight: 600; }
    .back {
      position: fixed; bottom: 20px; left: 20px; z-index: 10;
      background: rgba(0,229,255,0.15); border: 1px solid #00e5ff;
      color: #00e5ff; padding: 10px 18px; border-radius: 999px;
      text-decoration: none; font-family: system-ui; font-size: 0.9rem; font-weight: 600;
    }
    .back:hover { background: rgba(0,229,255,0.3); }
  </style>
</head>
<body>
  <div class="hud">
    <h1>AEROVOLT · INDUSTRIAL 3D</h1>
    <p>Viento: <span class="val" id="wind-val">0</span> m/s</p>
    <p>Lluvia: <span class="val" id="rain-val">0</span></p>
    <p style="margin-top:10px;font-size:0.75rem;opacity:0.7">Simulación de entorno · Fase TEST</p>
  </div>
  <a href="index.html" class="back">← Volver a la landing</a>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const IS_MOBILE = /Mobi|Android|iPhone/i.test(navigator.userAgent);

    const renderer = new THREE.WebGLRenderer({ antialias: !IS_MOBILE, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x0a0a0a, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 5, 15);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.03);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xff0000, 1.5, 30);
    pointLight.position.set(0, 8, 0);
    scene.add(pointLight);

    const industrialMetalMaterial = new THREE.MeshStandardMaterial({
      color: 0x1d1d1d, metalness: 0.9, roughness: 0.4
    });

    const redEnergyMaterial = new THREE.MeshStandardMaterial({
      color: 0x550000, metalness: 0.8, roughness: 0.2,
      emissive: new THREE.Color(0xff0000), emissiveIntensity: 3.5
    });

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), industrialMetalMaterial);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const boxGeo = new THREE.BoxGeometry(3, 8, 3);
    const building = new THREE.Mesh(boxGeo, industrialMetalMaterial);
    building.position.set(-5, 4, -5);
    scene.add(building);

    const building2 = new THREE.Mesh(boxGeo, industrialMetalMaterial);
    building2.position.set(6, 4, -8);
    building2.scale.set(1.2, 1.4, 1);
    scene.add(building2);

    const tubeGeo = new THREE.CylinderGeometry(0.1, 0.1, 20, 8);
    const energyTube = new THREE.Mesh(tubeGeo, redEnergyMaterial);
    energyTube.rotation.z = Math.PI / 2;
    energyTube.position.set(0, 0.2, -2);
    scene.add(energyTube);

    const energyTube2 = new THREE.Mesh(tubeGeo, redEnergyMaterial);
    energyTube2.rotation.z = Math.PI / 2;
    energyTube2.position.set(0, 0.2, 3);
    scene.add(energyTube2);

    let rainParticles = null;
    let rainGeometry = null;
    const maxRainCount = IS_MOBILE ? 1500 : 5000;
    let currentWindSpeed = 0;
    let currentRainIntensity = 0;

    function createRainSystem() {
      if (rainParticles) return;
      rainGeometry = new THREE.BufferGeometry();
      const positions = new Float32Array(maxRainCount * 3);
      for (let i = 0; i < maxRainCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 40;
        positions[i + 1] = Math.random() * 20;
        positions[i + 2] = (Math.random() - 0.5) * 40;
      }
      rainGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const rainMat = new THREE.PointsMaterial({
        color: 0x7799bb, size: IS_MOBILE ? 0.08 : 0.04,
        transparent: true, opacity: 0.6,
        blending: THREE.AdditiveBlending, depthWrite: false
      });
      rainParticles = new THREE.Points(rainGeometry, rainMat);
      scene.add(rainParticles);
    }

    function destroyRainSystem() {
      if (!rainParticles) return;
      scene.remove(rainParticles);
      rainGeometry.dispose();
      rainParticles.material.dispose();
      rainParticles = null;
      rainGeometry = null;
    }

    function updateWeatherEffects(weatherData) {
      currentWindSpeed = weatherData.wind.speed;
      currentRainIntensity = weatherData.rain ? weatherData.rain.intensity : 0;
      document.getElementById('wind-val').textContent = currentWindSpeed.toFixed(1);
      document.getElementById('rain-val').textContent = (currentRainIntensity * 100).toFixed(0) + '%';
      if (currentRainIntensity > 0) {
        createRainSystem();
        industrialMetalMaterial.roughness = THREE.MathUtils.lerp(0.4, 0.10, currentRainIntensity);
        industrialMetalMaterial.metalness = THREE.MathUtils.lerp(0.9, 1.0, currentRainIntensity);
        if (rainParticles) rainParticles.visible = true;
      } else {
        industrialMetalMaterial.roughness = 0.4;
        industrialMetalMaterial.metalness = 0.9;
        if (rainParticles) rainParticles.visible = false;
      }
    }

    setTimeout(() => updateWeatherEffects({ wind: { speed: 25 }, rain: { intensity: 0.8 } }), 2000);
    setTimeout(() => updateWeatherEffects({ wind: { speed: 8 }, rain: { intensity: 0.3 } }), 12000);
    setTimeout(() => updateWeatherEffects({ wind: { speed: 2 }, rain: { intensity: 0 } }), 22000);

    const renderPass = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.3, 0.85);
    const composer = new EffectComposer(renderer);
    composer.addPass(renderPass);
    composer.addPass(bloomPass);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();
      const windFactor = 1.0 + (currentWindSpeed * 0.12);
      redEnergyMaterial.emissiveIntensity = 3.5 + Math.sin(elapsedTime * 8 * windFactor) * 1.5;
      energyTube.rotation.y = elapsedTime * 0.5 * windFactor;
      energyTube2.rotation.y = -elapsedTime * 0.4 * windFactor;
      camera.position.x = Math.sin(elapsedTime * 0.08) * 2;
      camera.lookAt(0, 2, 0);

      if (rainParticles && currentRainIntensity > 0) {
        const positions = rainGeometry.attributes.position.array;
        for (let i = 0; i < positions.length; i += 3) {
          positions[i + 1] -= (0.3 + Math.random() * 0.2) * (1 + currentRainIntensity);
          positions[i] += (currentWindSpeed * 0.005);
          if (positions[i + 1] < 0) {
            positions[i + 1] = 20;
            positions[i] = (Math.random() - 0.5) * 40;
          }
        }
        rainGeometry.attributes.position.needsUpdate = true;
      }
      composer.render();
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    window.addEventListener('pagehide', () => {
      destroyRainSystem();
      scene.traverse((object) => {
        if (!object.isMesh) return;
        if (object.geometry) object.geometry.dispose();
        if (object.material) {
          if (Array.isArray(object.material)) object.material.forEach(m => m.dispose());
          else object.material.dispose();
        }
      });
      composer.dispose();
      renderer.dispose();
    });
  </script>
</body>
</html>
