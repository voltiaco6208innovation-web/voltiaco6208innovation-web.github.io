<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEROVOLT · Planta Solar 3D</title>
  <meta name="robots" content="noindex" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    .hud {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      color: #e8f0ff; background: rgba(5,7,13,0.85); backdrop-filter: blur(10px);
      border: 1px solid rgba(0,229,255,0.25); border-radius: 12px; padding: 12px 16px; max-width: 300px; font-size: 0.85rem;
    }
    .hud h1 { font-size: 0.9rem; color: #00e5ff; margin-bottom: 6px; letter-spacing: 0.05em; }
    .hud .demo { color: #f5c542; font-size: 0.72rem; font-weight: 700; margin-bottom: 8px; }
    .hud p { color: #8b9bb8; margin-bottom: 4px; font-size: 0.8rem; }
    .nav3d { position: fixed; top: 12px; right: 12px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; }
    .nav3d a {
      background: rgba(5,7,13,0.85); border: 1px solid rgba(0,229,255,0.25); color: #00e5ff;
      padding: 8px 14px; border-radius: 999px; text-decoration: none; font-size: 0.8rem; font-weight: 600;
    }
    .panel {
      position: fixed; right: 12px; bottom: 12px; width: min(340px, calc(100% - 24px)); z-index: 10;
      background: rgba(5,7,13,0.92); border: 1px solid rgba(0,229,255,0.25); border-radius: 14px;
      padding: 16px; color: #e8f0ff; font-size: 0.85rem; display: none;
    }
    .panel.open { display: block; }
    .panel h2 { font-size: 1rem; color: #00e5ff; margin-bottom: 4px; }
    .panel .status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .row span:last-child { font-weight: 600; color: #00e5ff; }
    .close-btn { float: right; background: none; border: none; color: #8b9bb8; font-size: 1.3rem; cursor: pointer; }
    .legend {
      position: fixed; bottom: 12px; left: 12px; z-index: 10;
      background: rgba(5,7,13,0.85); border: 1px solid rgba(0,229,255,0.2); border-radius: 10px;
      padding: 10px 14px; font-size: 0.75rem; color: #8b9bb8;
    }
    .legend span { margin-right: 10px; }
  </style>
</head>
<body>
  <div class="hud">
    <h1>AEROVOLT · PLANTA 3D</h1>
    <div class="demo">DEMO · FASE TEST · Datos simulados</div>
    <p>Haz clic en un inversor para ver detalle.</p>
    <p>Planta Norte Culiacán</p>
  </div>
  <div class="nav3d">
    <a href="monitor.html">Monitor</a>
    <a href="admin.html">Admin</a>
    <a href="index.html">Landing</a>
  </div>
  <div class="legend">
    <span>🟢 Normal</span><span>🟡 Advertencia</span><span>🟠 Falla</span><span>🔴 Crítico</span>
  </div>
  <div class="panel" id="detail">
    <button class="close-btn" id="close-detail">×</button>
    <div id="detail-body"></div>
  </div>

  <script src="js/mock-data.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const IS_MOBILE = /Mobi|Android|iPhone/i.test(navigator.userAgent);
    const plantInvs = AEROVOLT.inverters.filter(i => i.plantId === 'PLT-001');

    const renderer = new THREE.WebGLRenderer({ antialias: !IS_MOBILE, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x0a0a0a, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 14, 22);

    scene.add(new THREE.AmbientLight(0xffffff, 0.15));
    const sun = new THREE.DirectionalLight(0xfff2dd, 0.8);
    sun.position.set(10, 20, 8);
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 40),
      new THREE.MeshStandardMaterial({ color: 0x1a1f18, metalness: 0.2, roughness: 0.85 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const statusHex = { NORMAL: 0x00ff9d, ADVERTENCIA: 0xf5c542, FALLA: 0xff8c42, CRITICO: 0xff3b5c };
    const invMeshes = [];
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    plantInvs.forEach((inv, idx) => {
      const col = idx % 3;
      const row = Math.floor(idx / 3);
      const x = (col - 1) * 7;
      const z = row * 8 - 4;

      const pad = new THREE.Mesh(
        new THREE.BoxGeometry(3.2, 0.3, 2.4),
        new THREE.MeshStandardMaterial({ color: 0x2a2a2a, metalness: 0.6, roughness: 0.4 })
      );
      pad.position.set(x, 0.15, z);
      scene.add(pad);

      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x222222, metalness: 0.7, roughness: 0.35,
        emissive: new THREE.Color(statusHex[inv.status] || 0x444444),
        emissiveIntensity: 0.45
      });
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.2, 1.4), bodyMat);
      body.position.set(x, 1.4, z);
      body.userData = { invId: inv.id };
      scene.add(body);
      invMeshes.push(body);

      const beacon = new THREE.Mesh(
        new THREE.SphereGeometry(0.25, 12, 12),
        new THREE.MeshStandardMaterial({
          color: statusHex[inv.status],
          emissive: new THREE.Color(statusHex[inv.status]),
          emissiveIntensity: 2.2
        })
      );
      beacon.position.set(x, 2.7, z);
      beacon.userData = { invId: inv.id };
      scene.add(beacon);
      invMeshes.push(beacon);

      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, 256, 64);
      ctx.fillStyle = '#00e5ff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(inv.id, 128, 42);
      const tex = new THREE.CanvasTexture(canvas);
      const label = new THREE.Mesh(
        new THREE.PlaneGeometry(2.2, 0.55),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true })
      );
      label.position.set(x, 3.3, z);
      scene.add(label);
    });

    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 4; c++) {
        const panel = new THREE.Mesh(
          new THREE.BoxGeometry(4, 0.08, 1.5),
          new THREE.MeshStandardMaterial({ color: 0x0a1525, metalness: 0.8, roughness: 0.25, emissive: 0x001133, emissiveIntensity: 0.15 })
        );
        panel.position.set((c - 1.5) * 5, 0.8, -12 - r * 2.5);
        panel.rotation.x = -0.35;
        scene.add(panel);
      }
    }

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.35, 0.82));

    function showDetail(invId) {
      const inv = AEROVOLT.inverters.find(i => i.id === invId);
      if (!inv) return;
      const color = AEROVOLT.statusColor(inv.status);
      let alarmHtml = inv.alarm ? ('<p style="color:#ff8c42;margin:8px 0">⚠ ' + inv.alarm + '</p>') : '';
      document.getElementById('detail-body').innerHTML =
        '<h2>' + inv.id + '</h2>' +
        '<span class="status" style="background:' + color + '22;color:' + color + '">' + inv.status + '</span>' +
        alarmHtml +
        '<div class="row"><span>Potencia</span><span>' + inv.power_kw + ' kW</span></div>' +
        '<div class="row"><span>Esperada</span><span>' + inv.expected_kw + ' kW</span></div>' +
        '<div class="row"><span>Rendimiento</span><span>' + AEROVOLT.calcPR(inv) + '%</span></div>' +
        '<div class="row"><span>DC</span><span>' + inv.dc_v + ' V / ' + inv.dc_a + ' A</span></div>' +
        '<div class="row"><span>AC</span><span>' + inv.ac_v + ' V / ' + inv.ac_a + ' A</span></div>' +
        '<div class="row"><span>Energía</span><span>' + inv.energy_kwh + ' kWh</span></div>' +
        '<div class="row"><span>Última comm</span><span>' + inv.last_comm_s + ' s</span></div>' +
        '<p style="margin-top:12px;font-size:0.72rem;color:#f5c542">Datos simulados · DEMO</p>' +
        '<p style="margin-top:6px"><a href="monitor.html" style="color:#00e5ff">Abrir en Monitor →</a></p>';
      document.getElementById('detail').classList.add('open');
    }

    document.getElementById('close-detail').onclick = function () {
      document.getElementById('detail').classList.remove('open');
    };

    window.addEventListener('pointerdown', function (e) {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(invMeshes);
      if (hits.length && hits[0].object.userData.invId) {
        showDetail(hits[0].object.userData.invId);
      }
    });

    const params = new URLSearchParams(location.search);
    if (params.get('inv')) setTimeout(function () { showDetail(params.get('inv')); }, 600);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      camera.position.x = Math.sin(t * 0.08) * 3;
      camera.lookAt(0, 1.5, 0);
      invMeshes.forEach(function (m) {
        if (m.geometry.type === 'SphereGeometry' && m.material.emissive) {
          m.material.emissiveIntensity = 1.8 + Math.sin(t * 3) * 0.5;
        }
      });
      composer.render();
    }
    animate();

    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
