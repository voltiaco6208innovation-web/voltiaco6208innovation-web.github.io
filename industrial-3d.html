<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEROVOLT · Planta Solar 3D</title>
  <meta name="robots" content="noindex" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1018; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    .hud {
      position: fixed; top: 12px; left: 12px; z-index: 10; max-width: 300px;
      background: rgba(8,12,20,0.88); backdrop-filter: blur(12px);
      border: 1px solid rgba(0,229,255,0.25); border-radius: 14px; padding: 14px 16px; color: #e8f0ff;
    }
    .hud h1 { font-size: 0.9rem; color: #00e5ff; letter-spacing: 0.06em; margin-bottom: 4px; }
    .hud .demo { color: #f5c542; font-size: 0.7rem; font-weight: 700; margin-bottom: 8px; }
    .hud p { color: #8b9bb8; font-size: 0.8rem; line-height: 1.4; }
    .nav3d { position: fixed; top: 12px; right: 12px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; }
    .nav3d a {
      background: rgba(8,12,20,0.88); border: 1px solid rgba(0,229,255,0.25); color: #00e5ff;
      padding: 8px 14px; border-radius: 999px; text-decoration: none; font-size: 0.8rem; font-weight: 600;
    }
    .legend {
      position: fixed; bottom: 12px; left: 12px; z-index: 10;
      background: rgba(8,12,20,0.88); border: 1px solid rgba(0,229,255,0.2);
      border-radius: 10px; padding: 10px 14px; font-size: 0.75rem; color: #8b9bb8;
    }
    .legend span { margin-right: 12px; }
    .panel {
      position: fixed; right: 12px; bottom: 12px; width: min(340px, calc(100% - 24px)); z-index: 10;
      background: rgba(8,12,20,0.94); border: 1px solid rgba(0,229,255,0.28); border-radius: 14px;
      padding: 16px; color: #e8f0ff; font-size: 0.85rem; display: none;
    }
    .panel.open { display: block; }
    .panel h2 { font-size: 1.05rem; color: #00e5ff; margin-bottom: 4px; }
    .panel .st { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; margin: 6px 0 10px; }
    .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .row span:last-child { font-weight: 600; color: #00e5ff; }
    .close-btn { float: right; background: none; border: none; color: #8b9bb8; font-size: 1.3rem; cursor: pointer; }
    .hint {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: rgba(0,0,0,0.55); color: #8b9bb8; font-size: 0.75rem; padding: 6px 14px; border-radius: 999px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hud">
    <h1>AEROVOLT · PLANTA 3D</h1>
    <div class="demo">DEMO · FASE TEST · Datos simulados</div>
    <p>Planta Norte Culiacán<br>Arrastra para orbitar · Scroll zoom · Clic en inversor</p>
  </div>
  <div class="nav3d">
    <a href="monitor.html">Monitor</a>
    <a href="analytics.html">Analytics</a>
    <a href="control-center.html">Control</a>
    <a href="agentes.html">Agentes</a>
  </div>
  <div class="legend">
    <span>🟢 Normal</span><span>🟡 Advertencia</span><span>🟠 Falla</span><span>🔴 Crítico</span>
  </div>
  <div class="hint">Arrastra · Zoom · Clic en gabinete de inversor</div>
  <div class="panel" id="detail">
    <button class="close-btn" id="close-detail">×</button>
    <div id="detail-body"></div>
  </div>

  <script src="js/mock-data.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const IS_MOBILE = /Mobi|Android|iPhone/i.test(navigator.userAgent) || window.innerWidth < 768;
    const plantInvs = AEROVOLT.inverters.filter(i => i.plantId === 'PLT-001');

    const renderer = new THREE.WebGLRenderer({ antialias: !IS_MOBILE, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x0a1520, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = !IS_MOBILE;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a1520, 0.012);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(28, 22, 32);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.minDistance = 12;
    controls.maxDistance = 80;
    controls.target.set(0, 1, 0);

    scene.add(new THREE.AmbientLight(0xb0c4de, 0.35));
    const sun = new THREE.DirectionalLight(0xfff5e0, 1.4);
    sun.position.set(30, 40, 20);
    if (!IS_MOBILE) {
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.near = 1;
      sun.shadow.camera.far = 120;
      sun.shadow.camera.left = -40;
      sun.shadow.camera.right = 40;
      sun.shadow.camera.top = 40;
      sun.shadow.camera.bottom = -40;
    }
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x4488ff, 0.25);
    fill.position.set(-20, 10, -15);
    scene.add(fill);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(120, 100),
      new THREE.MeshStandardMaterial({ color: 0x1a2418, roughness: 0.95, metalness: 0.05 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    function addPad(x, z, w, d) {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(w, 0.08, d),
        new THREE.MeshStandardMaterial({ color: 0x2a3220, roughness: 1 })
      );
      m.position.set(x, 0.04, z);
      m.receiveShadow = true;
      scene.add(m);
    }

    const panelGeo = new THREE.BoxGeometry(1.6, 0.04, 1.0);
    const frameGeo = new THREE.BoxGeometry(1.68, 0.06, 1.08);
    const panelMat = new THREE.MeshStandardMaterial({
      color: 0x0a2848, metalness: 0.85, roughness: 0.25,
      emissive: 0x001a33, emissiveIntensity: 0.15
    });
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.6, roughness: 0.4 });
    const legMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.5, roughness: 0.5 });

    function createPanel(x, z, tilt) {
      const g = new THREE.Group();
      const frame = new THREE.Mesh(frameGeo, frameMat);
      const cell = new THREE.Mesh(panelGeo, panelMat);
      cell.position.y = 0.02;
      frame.add(cell);
      frame.position.y = 1.1;
      frame.rotation.x = -tilt;
      g.add(frame);
      for (const lx of [-0.6, 0.6]) {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 1.0, 6), legMat);
        leg.position.set(lx, 0.5, 0.15);
        g.add(leg);
      }
      g.position.set(x, 0, z);
      if (!IS_MOBILE) { frame.castShadow = true; cell.castShadow = true; }
      scene.add(g);
    }

    const tilt = 0.45;
    for (let row = 0; row < 4; row++) {
      const z = -6 - row * 4.5;
      addPad(0, z, 16, 2.2);
      for (let col = 0; col < 8; col++) {
        createPanel(-7 + col * 2.0, z, tilt);
      }
    }

    const statusHex = { NORMAL: 0x00ff9d, ADVERTENCIA: 0xf5c542, FALLA: 0xff8c42, CRITICO: 0xff3b5c };
    const invMeshes = [];
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function createInverter(inv, index) {
      const group = new THREE.Group();
      const x = -10 + (index % 5) * 5;
      const z = 8 + Math.floor(index / 5) * 5;

      const base = new THREE.Mesh(
        new THREE.BoxGeometry(2.2, 0.25, 1.4),
        new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 })
      );
      base.position.y = 0.12;
      base.receiveShadow = true;
      group.add(base);

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 2.0, 0.9),
        new THREE.MeshStandardMaterial({ color: 0x2a2e35, metalness: 0.7, roughness: 0.35 })
      );
      body.position.y = 1.25;
      body.castShadow = true;
      body.userData = { invId: inv.id };
      group.add(body);

      const door = new THREE.Mesh(
        new THREE.PlaneGeometry(1.3, 1.6),
        new THREE.MeshStandardMaterial({ color: 0x1e2228, metalness: 0.5, roughness: 0.4 })
      );
      door.position.set(0, 1.25, 0.46);
      door.userData = { invId: inv.id };
      group.add(door);

      const ledMat = new THREE.MeshStandardMaterial({
        color: statusHex[inv.status] || 0x444444,
        emissive: new THREE.Color(statusHex[inv.status] || 0x444444),
        emissiveIntensity: 2.5, toneMapped: false
      });
      const led = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.05), ledMat);
      led.position.set(0, 2.15, 0.48);
      led.userData = { invId: inv.id };
      group.add(led);

      const beacon = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 12, 12),
        new THREE.MeshStandardMaterial({
          color: statusHex[inv.status],
          emissive: new THREE.Color(statusHex[inv.status]),
          emissiveIntensity: 3, toneMapped: false
        })
      );
      beacon.position.set(0, 2.4, 0);
      beacon.userData = { invId: inv.id };
      group.add(beacon);

      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, 256, 64);
      ctx.fillStyle = '#00e5ff';
      ctx.font = 'bold 32px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(inv.id, 128, 44);
      const tex = new THREE.CanvasTexture(canvas);
      const label = new THREE.Mesh(
        new THREE.PlaneGeometry(1.4, 0.35),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
      );
      label.position.set(0, 2.7, 0);
      group.add(label);

      group.position.set(x, 0, z);
      scene.add(group);
      invMeshes.push(body, led, beacon, door);
      return { group, led, beacon, inv };
    }

    const invObjects = plantInvs.map((inv, i) => createInverter(inv, i));

    const xfmr = new THREE.Mesh(
      new THREE.BoxGeometry(3, 2.2, 2),
      new THREE.MeshStandardMaterial({ color: 0x3a4550, metalness: 0.6, roughness: 0.4 })
    );
    xfmr.position.set(14, 1.1, 6);
    xfmr.castShadow = true;
    scene.add(xfmr);

    for (let i = -18; i <= 18; i += 3) {
      for (const z of [-28, 16]) {
        const post = new THREE.Mesh(
          new THREE.CylinderGeometry(0.06, 0.06, 1.8, 6),
          new THREE.MeshStandardMaterial({ color: 0x666666 })
        );
        post.position.set(i, 0.9, z);
        scene.add(post);
      }
    }

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), IS_MOBILE ? 0.4 : 0.65, 0.4, 0.85));

    function showDetail(invId) {
      const inv = AEROVOLT.inverters.find(i => i.id === invId);
      if (!inv) return;
      const color = AEROVOLT.statusColor(inv.status);
      let alarmHtml = inv.alarm ? ('<p style="color:#ff8c42;margin:8px 0">⚠ ' + inv.alarm + '</p>') : '';
      document.getElementById('detail-body').innerHTML =
        '<h2>' + inv.id + '</h2>' +
        '<span class="st" style="background:' + color + '22;color:' + color + '">' + inv.status + '</span>' +
        alarmHtml +
        '<div class="row"><span>Potencia</span><span>' + inv.power_kw + ' kW</span></div>' +
        '<div class="row"><span>Esperada</span><span>' + inv.expected_kw + ' kW</span></div>' +
        '<div class="row"><span>Rendimiento PR</span><span>' + AEROVOLT.calcPR(inv) + '%</span></div>' +
        '<div class="row"><span>DC</span><span>' + inv.dc_v + ' V / ' + inv.dc_a + ' A</span></div>' +
        '<div class="row"><span>AC</span><span>' + inv.ac_v + ' V / ' + inv.ac_a + ' A</span></div>' +
        '<div class="row"><span>Energía</span><span>' + inv.energy_kwh + ' kWh</span></div>' +
        '<div class="row"><span>Última comm</span><span>' + inv.last_comm_s + ' s</span></div>' +
        '<p style="margin-top:12px;font-size:0.72rem;color:#f5c542">Datos simulados · DEMO</p>' +
        '<p style="margin-top:6px"><a href="monitor.html" style="color:#00e5ff">Abrir en Monitor →</a></p>';
      document.getElementById('detail').classList.add('open');
    }

    document.getElementById('close-detail').onclick = () => {
      document.getElementById('detail').classList.remove('open');
    };

    let pointerDown = false, moved = false;
    renderer.domElement.addEventListener('pointerdown', () => { pointerDown = true; moved = false; });
    renderer.domElement.addEventListener('pointermove', () => { if (pointerDown) moved = true; });
    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!pointerDown || moved) { pointerDown = false; return; }
      pointerDown = false;
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(invMeshes, false);
      if (hits.length && hits[0].object.userData.invId) showDetail(hits[0].object.userData.invId);
    });

    const params = new URLSearchParams(location.search);
    if (params.get('inv')) setTimeout(() => showDetail(params.get('inv')), 700);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      controls.update();
      invObjects.forEach(({ beacon, led, inv }) => {
        if (inv.status === 'CRITICO') {
          const blink = Math.sin(t * 8) > 0 ? 3 : 0.3;
          beacon.material.emissiveIntensity = blink;
          led.material.emissiveIntensity = blink;
        } else {
          beacon.material.emissiveIntensity = 2.2 + Math.sin(t * 2) * 0.4;
          led.material.emissiveIntensity = 2.0 + Math.sin(t * 2) * 0.3;
        }
      });
      panelMat.emissiveIntensity = 0.12 + Math.sin(t * 0.5) * 0.04;
      composer.render();
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
